<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVault Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<body>

<div class="container">

    <!-- Left Side -->
    <div class="left">

        <div class="logo">
            <img src="images/logo.PNG" alt="Logo">
            <h1>Edu<span>Vault</span></h1>
        </div>

        <h2>Wanna manage<br>your <span>pocket?</span></h2>

        <div class="tag">
            <i class="fa-solid fa-heart"></i>
            <p>We are here for you</p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-graduation-cap"></i>
            <div>
                <h3>First time in the college?</h3>
                <div><p><a href="amenities.html" class="amenities">Know what you need in college.</a></p></div>
            </div>
        </div>
    
        

    </div>

    <!-- Right Side -->
    <div class="right">

        <div class="login-card">

            <h1>Welcome Back! 👋</h1>
            <p>Login to continue to <span>EduVault</span></p>

            <div class="input-box">
                <i class="fa-regular fa-user"></i>
                <input type="text" placeholder="Enter Username">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Enter Password">
                <i class="fa-regular fa-eye"></i>
            </div>

            <button>Login</button>

            <div class="divider">
                <span></span> OR <span></span>
            </div>

            <div class="register">
                Click here to
                <a href="#">REGISTER</a>
            </div>

            <div class="footer">
                <i class="fa-solid fa-shield"></i>
                Your data is safe with EduVault
            </div>

        </div>

    </div>

</div>

</body>
</html>
